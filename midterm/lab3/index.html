<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request For Proposal</title>
</head>
<body>
    <fieldset>
        <legend style="font-size: 30px; color: blue;">Request for Proposal</legend>
        <table border="0">
        <tr>
            <td style="text-align: end;">Your Company:</td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td style="text-align: end;">Email: </td>
            <td><input type="email"></td>
        </tr>
        <tr>
            <td style="text-align: end;">Username: </td>
            <td><input type="text"></td>
        </tr>
        <tr>
            <td style="text-align: end;">Password: </td>
            <td><input type="password"></td>
        </tr>
        <tr>
            <td style="text-align: end;">Your business: </td>
            <td><textarea name="" id="" placeholder="Briefly describe your business in this place:" ></textarea></td>
        </tr>
        <tr>
            <td>Company size: </td>
            <td></td>
        </tr>
        <tr>
            <td></td>
            <td><input type="radio" id="less than 10" value="less than 10" name="Company size"><label>Less than 10</label></td>
        </tr>
        <tr>
            <td></td>
            <td><input type="radio" id="" value="" name="Company size"><label>11 to 50</label></td>
        </tr>
        <tr>
            <td></td>
            <td><input type="radio" id="" value="" name="Company size"><label>50 to 200</label></td>
        </tr>
        <tr>
            <td></td>
            <td><input type="radio" id="" value="" name="Company size"><label>over 200</label></td>
        </tr>
        <tr>
            <td style="text-align: end;">Services: </td>
            <td>
                <input type="checkbox">Brand Identity 
                <input type="checkbox" name="" id="">New Website 
                <input type="checkbox">Web design
            </td>
        </tr>
        <tr>
            <td style="text-align: end;"> Timeline:</td>
            <td>
                <select>
                    <optgroup>
                        <option></option>
                        <option>Immediately</option>
                        <option>1-2 weeks</option>
                        <option>3-6 weeks</option>
                        <option>7-2 months</option>
                    </optgroup>
                </select>
            </td>
        </tr>
        <tr>
            <td></td>
            <td><button>Send to dev/design</button></td>
        </tr>
        

    </table>
    </fieldset>
    <a href="requestt.png" target="_blank" style="text-decoration: none;"> Source Code</a> <br>
</body>
</html>
