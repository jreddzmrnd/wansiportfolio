<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="proposition.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finals Lab Task 1</title>
    <style>
        body {
    height: 3000px;
    }
    img {
        height: 500px;
        width: 350px;
        display: block;
        margin: 50px auto 0 auto;
    }
    .xbutton {
        position: absolute;
        background-color: black;
        color: white;
        border-radius: 50%;
        height: 5.5%;
        width: 3%;
        top: 20px;
        right: 20px;
        cursor: pointer;
    }
    .box {
        width: 320px;
        height: 180px;
        position: fixed;
        background-color: gray;
        bottom: 20px;
        right: 20px;
    }

    .product {
        position: relative;
        width: 350px;
        margin: 50px auto;
    }

    .product img {
        width: 100%;
        height: 500px;
        display: block;
    }

    .badge {
        position: absolute;
        top: 10px;
        right: 10px;
        background: black;
        color: white;
        padding: 5px 10px;
        font-size: 14px;
    }

    .overlay {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 80px;
        background: rgba(255, 255, 255, 0.6);
    }

    .cart {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 10px 15px;
        background: white;
        border: 1px solid black;
        cursor: pointer;
        z-index: 1;
    }
    </style>
</head>
<body>
    <div class="product">
    <img src="shirt.png" alt="">
    <div class="badge">20% OFF</div>
    </div>

    <button class="xbutton">X</button>
    <div class="box"></div>

    <div class="product">
    <img src="shirt.png" alt="">
    <div class="badge">20% OFF</div>

    <div class="overlay"></div>
    <button class="cart">Add to Cart</button>
    </div>

<button class="xbutton">X</button>
<div class="box"></div>
</body>
</html>
